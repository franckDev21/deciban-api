# Configuration Alembic.
#
# L'URL de la base n'est VOLONTAIREMENT pas ici : elle vit dans .env
# (DATABASE_URL) et contient le mot de passe PostgreSQL. La mettre dans ce
# fichier, qui est suivi par git, reviendrait a publier le mot de passe sur
# GitHub. C'est migrations/env.py qui la lit depuis la configuration de
# l'application.

[alembic]
script_location = migrations
prepend_sys_path = .
# Les revisions sont prefixees par un numero d'ordre : le tri alphabetique du
# dossier versions/ correspond alors a l'ordre chronologique reel, ce qui rend
# l'historique lisible sans ouvrir chaque fichier.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
