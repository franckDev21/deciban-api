name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Style, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Style
        run: ruff check deciban tests

      - name: Formatage
        run: ruff format --check deciban tests

      - name: Types
        run: mypy deciban
        continue-on-error: true

      - name: Tests
        run: pytest --cov=deciban --cov-report=term-missing

  docker:
    name: Image et demarrage reel
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: deciban-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Une image qui compile mais ne demarre pas doit echouer ici.
      - name: Verifier que l'API repond
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "API en ligne"
              curl -s http://localhost:8000/api/health
              docker compose down
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas repondu dans le delai imparti"
          docker compose logs
          docker compose down
          exit 1
