[project]
name = "deciban-api"
version = "0.1.0"
description = "Moteur de preuve d'humanite, fonde sur l'accumulation de rapports de vraisemblance"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pywebpush>=2.0",
    "cryptography>=43.0",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

# Sans cette section, setuptools inspecte la racine du depot, y trouve DEUX
# dossiers de premier niveau — « deciban » et « migrations » — et refuse de
# construire (« Multiple top-level packages discovered in a flat-layout »).
# Le build Docker ne le voyait pas : son etape de construction ne copie que
# « deciban ». L'integration continue, elle, installe depuis le depot entier.
#
# « migrations » n'est pas une bibliotheque : c'est un dossier de scripts
# executes par Alembic. Il n'a rien a faire dans le paquet installe.
[tool.setuptools.packages.find]
include = ["deciban*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
